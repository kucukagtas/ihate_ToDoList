<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container app-container py-4">
      <!-- Header with Dark Mode Toggle -->
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 fw-bold d-flex align-items-center gap-2">
          <i class="fa-solid fa-basket-shopping text-primary"></i>
          <span>Shopping List</span>
        </h1>
        <button
          id="theme_toggle"
          class="btn btn-outline-secondary btn-sm rounded-circle theme-btn"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>

      <!-- Add Item Form -->
      <form class="shopping-form border rounded p-3 mb-3 bg-body shadow-sm">
        <div class="input-group">
          <input
            type="text"
            id="item_name"
            class="form-control"
            placeholder="Add new item..."
            autocomplete="off"
          />
          <button type="submit" class="btn btn-primary px-3 d-flex align-items-center gap-1">
            <i class="fa-solid fa-plus"></i>
            <span class="d-none d-sm-inline">Add</span>
          </button>
        </div>
      </form>

      <!-- Controls Area (Search, Badges, Filters) -->
      <div id="controls_container" class="mb-3">
        <!-- Live Search -->
        <div class="input-group input-group-sm mb-3 shadow-sm">
          <span class="input-group-text bg-body text-muted border-end-0">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input
            type="search"
            id="search_input"
            class="form-control border-start-0"
            placeholder="Search items..."
            autocomplete="off"
          />
        </div>

        <!-- Counters Badges -->
        <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
          <span class="badge bg-secondary-subtle text-secondary-emphasis border flex-fill py-2" id="counter_total">
            Total: 0
          </span>
          <span class="badge bg-warning-subtle text-warning-emphasis border flex-fill py-2" id="counter_pending">
            Remaining: 0
          </span>
          <span class="badge bg-success-subtle text-success-emphasis border flex-fill py-2" id="counter_completed">
            Completed: 0
          </span>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-buttons d-flex gap-2">
          <button item-filter="all" class="btn btn-primary flex-fill btn-sm">All</button>
          <button item-filter="incompleted" class="btn btn-secondary flex-fill btn-sm">
            Incompleted
          </button>
          <button item-filter="completed" class="btn btn-secondary flex-fill btn-sm">
            Completed
          </button>
        </div>
      </div>

      <!-- Empty State Alert -->
      <div class="alert alert-custom text-center py-3 mb-3 d-none" id="empty_alert">
        <i class="fa-solid fa-circle-info me-2"></i>No items yet!
      </div>

      <!-- Search No Match Alert -->
      <div class="alert alert-secondary text-center py-2 mb-3 d-none" id="search_alert">
        <i class="fa-solid fa-search me-1"></i>No matching items found.
      </div>

      <!-- Shopping List -->
      <ul class="shopping-list list-unstyled mb-3"></ul>

      <!-- Action Buttons -->
      <div class="action-buttons d-flex justify-content-between gap-2">
        <button class="btn btn-outline-warning btn-sm clear-completed d-flex align-items-center gap-1">
          <i class="fa-solid fa-check-double"></i>
          <span>Clear Completed</span>
        </button>
        <button class="btn btn-outline-danger btn-sm clear-all d-flex align-items-center gap-1">
          <i class="fa-solid fa-trash-can"></i>
          <span>Clear All</span>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
